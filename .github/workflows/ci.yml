name: CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    # The backend tests use H2 for unit/context tests, so PostgreSQL is NOT
    # needed here. When we introduce Testcontainers integration tests in
    # Milestone 1, Docker is already available on ubuntu-latest runners.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache Gradle dependencies and wrapper to speed up subsequent builds.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew
        working-directory: ${{ github.workspace }}

      - name: Build (compile only — fail fast on compile errors)
        run: ./gradlew classes testClasses --no-daemon
        working-directory: backend

      - name: Run tests
        run: ./gradlew test --no-daemon
        working-directory: backend

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/
          retention-days: 7
