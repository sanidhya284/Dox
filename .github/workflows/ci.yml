name: CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Unit tests use H2. Integration tests use Testcontainers (real PostgreSQL)
    # and need Docker, which ubuntu-latest provides.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache Gradle dependencies and wrapper to speed up subsequent builds.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew
        working-directory: ${{ github.workspace }}

      - name: Build (compile only — fail fast on compile errors)
        run: ./gradlew classes testClasses --no-daemon
        working-directory: backend

      - name: Unit tests
        run: ./gradlew test --no-daemon
        working-directory: backend

      - name: Let Testcontainers talk to newer Docker Engines
        run: echo "api.version=1.44" > ~/.docker-java.properties
        working-directory: backend

      - name: Integration tests (Testcontainers + PostgreSQL)
        run: ./gradlew integrationTest --no-daemon
        working-directory: backend

      - name: Production jar has no dev/bench profiles
        run: ./gradlew -PprodJar bootJar verifyProdJar --no-daemon
        working-directory: backend

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/
          retention-days: 7

  migrations:
    name: Migrations are additive (expand/contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The check first proves it can fail (destructive samples must be flagged), then checks the real files:
      # no existing migration changed since the base, and new migrations above V6 are additive (ADR-0011 D10).
      - name: Self-test
        run: python3 .github/scripts/check_migrations.py --self-test
      - name: Check
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 .github/scripts/check_migrations.py --base "$BASE"

  frontend:
    name: Frontend (lint, typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      # node_modules itself is cached (keyed on the lockfile); npm ci runs only on a cache miss.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node22-nm-${{ hashFiles('frontend/package-lock.json') }}
      - name: npm ci
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest
        run: npm run test:report
      - run: npm run build
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: frontend/test-results/vitest.json
          retention-days: 7

  e2e:
    name: Stack smoke + e2e (compose, Caddy, Playwright)
    needs: [build-and-test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Docker layer cache in the GitHub Actions cache (both images), so unchanged layers aren't rebuilt.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: chat-app:local
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          tags: chat-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # e2e signs up, logs in and sends many times from one IP: compose.e2e.yml raises the rate limits (env vars,
      # never a profile in the image). The app is recreated WITHOUT it before smoke.sh, which checks a real limit.
      - name: Start the stack (local-only values, e2e limits)
        working-directory: deploy
        run: |
          cp .env.local.example .env
          docker compose -f compose.yml -f compose.e2e.yml up -d --wait --wait-timeout 180
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node22-nm-${{ hashFiles('frontend/package-lock.json') }}
      - name: npm ci
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # e2e runs before smoke.sh: smoke's last check spends this machine's per-IP login budget.
      - name: e2e (Playwright; at most 1 retry, recorded)
        working-directory: frontend
        run: npm run e2e
      - name: Record e2e attempts and retries
        if: always()
        working-directory: frontend
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = 'test-results/e2e.json'
          if not os.path.exists(p):
              print('### e2e: no report (the run did not start)'); raise SystemExit
          d = json.load(open(p)); s = d['stats']
          print(f"### e2e: {s['expected']} passed, {s['unexpected']} failed, {s['flaky']} flaky (passed on retry)")
          for su in d['suites']:
              for sp in su.get('specs', []):
                  for t in sp['tests']:
                      print(f"- {sp['title']}: {t['status']}, attempts {len(t['results'])}")
          EOF
      - name: Recreate the app with production limits (no e2e override)
        working-directory: deploy
        run: docker compose -f compose.yml up -d --wait --wait-timeout 180 app
      - name: Smoke checks
        run: deploy/smoke.sh https://localhost chat-app:local
      - name: Stack logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose -f compose.yml logs --tail 200
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
