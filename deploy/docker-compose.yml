# Docker Compose — Local Development
#
# Starts only the PostgreSQL database.
# The Spring Boot backend runs on your host machine (./gradlew bootRun).
# This keeps the development loop fast: change Java code → restart JVM,
# without rebuilding a Docker image every time.
#
# Usage:
#   docker compose up -d        # start PostgreSQL in background
#   docker compose down         # stop and remove containers
#   docker compose down -v      # also delete the data volume (fresh DB)

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatplatform-postgres
    restart: unless-stopped
    ports:
      # Host port 5432 → container port 5432
      # Change the left side if 5432 is already in use on your machine.
      - "5432:5432"
    environment:
      POSTGRES_DB: chatplatform
      POSTGRES_USER: chatplatform
      POSTGRES_PASSWORD: chatplatform
    volumes:
      # Named volume keeps data between `docker compose up/down` restarts.
      # Omit this line (or use `docker compose down -v`) for a clean slate.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatplatform -d chatplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
