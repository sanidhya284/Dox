plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.chatplatform'
version = '0.1.0-SNAPSHOT'

// ── Java Source/Target Compatibility ────────────────────────────────────────
// We target Java 21 (LTS) bytecode for maximum runtime compatibility.
// The build uses whatever JDK is installed locally (23 on dev machines).
// CI installs JDK 21 explicitly via actions/setup-java.
//
// NOTE: If you later add a toolchain resolver plugin (e.g. Foojay), you can
// revert this to a toolchain block and Gradle will auto-download JDK 21.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // ── Spring Web (REST) ──────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── Spring Security ────────────────────────────────────────────────────
    // Provides: filter chain, BCryptPasswordEncoder, SecurityContext,
    // @AuthenticationPrincipal, method-level @PreAuthorize.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // ── JWT (JJWT) ────────────────────────────────────────────────────────
    // jjwt-api: the public API (builder, parser)
    // jjwt-impl: runtime implementation (not on compile classpath by design)
    // jjwt-jackson: JSON serialisation for claims
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ── Database: Spring JDBC ──────────────────────────────────────────────
    // JdbcClient (Spring 6.1+) gives a fluent, type-safe API over plain JDBC.
    // We deliberately avoid Hibernate/JPA to keep query behaviour explicit and
    // predictable — critical for a messaging system that will need fine-grained
    // query control in later milestones.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // ── Connection Pool: HikariCP ──────────────────────────────────────────
    // spring-boot-starter-jdbc pulls HikariCP transitively; listed here
    // explicitly so the dependency is visible and intentional.
    implementation 'com.zaxxer:HikariCP'

    // ── PostgreSQL JDBC Driver ─────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'

    // ── Database Migrations: Flyway ────────────────────────────────────────
    implementation 'org.flywaydb:flyway-core'
    // Flyway's PostgreSQL-specific support module (required for Flyway 10+)
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // ── Observability: Spring Boot Actuator ───────────────────────────────
    // Exposes /actuator/health and other management endpoints out of the box.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Phase 5-lite: Prometheus scrape format for Micrometer (version managed by Spring Boot). ADR-0009.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // ── Testing ────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // H2 in-memory DB for unit/context tests (no PostgreSQL needed in CI).
    // Integration tests use Testcontainers with a real PostgreSQL container.
    testRuntimeOnly 'com.h2database:h2'

    // Testcontainers — wired now so integration tests can use a real
    // PostgreSQL container in later milestones without changing the build.
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'

    // Load harness latency histograms (Phase 5-lite; same version Micrometer already brings in).
    testImplementation 'org.hdrhistogram:HdrHistogram:2.2.2'
}

dependencyManagement {
    imports {
        // Align Testcontainers BOM with Spring Boot's managed version
        mavenBom "org.testcontainers:testcontainers-bom:1.20.1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Exclude Testcontainers tests from the default unit-test run.
    // Integration tests require Docker and run separately via: ./gradlew integrationTest
    exclude '**/integration/**'
}

// ── Integration tests (require Docker / Testcontainers) ───────────────────────
// Run with: ./gradlew integrationTest
// These tests are skipped in CI unless Docker is available.
tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    include '**/integration/**'
    // Re-use the test classpath; no separate source set needed.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    description = 'Runs integration tests that require a running Docker daemon.'
    group = 'verification'
    timeout = java.time.Duration.ofMinutes(10)
    // ConvergenceTest replay/negative runs: ./gradlew integrationTest -Dconvergence.seed=22 -Dconvergence.bug=NO_DEDUPE
    System.properties.findAll { it.key.toString().startsWith('convergence.') }
            .each { k, v -> systemProperty k.toString(), v.toString() }
}

// ── Load harness (Phase 5-lite; docs/BENCHMARKS.md) ──────────────────────────────
// On demand only: not part of check, test or integrationTest, never in CI. Targets a separately started
// app (bench profile) and the dedicated benchmark database. Arguments are key=value pairs, e.g.
//   ./gradlew loadTest -Pload.args="scenario=A rate=50 warmup=PT30S window=PT60S out=../bench-results"
tasks.register('loadTest', JavaExec) {
    description = 'Runs one load-harness scenario against a running app (see docs/BENCHMARKS.md).'
    group = 'benchmark'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.chatplatform.load.LoadMain'
    args = (project.findProperty('load.args') ?: '').toString().tokenize(' ')
    jvmArgs = ['-Xms512m', '-Xmx512m', '-XX:+UseG1GC']
}

// Re-derive run outcomes from stored summaries with the current classifier (no re-run):
//   python3 deploy/bench/relabel.py   (calls this task, then writes the labels back)
tasks.register('benchRelabel', JavaExec) {
    description = 'Prints re-derived outcomes for stored run summaries (see docs/BENCHMARKS.md).'
    group = 'benchmark'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.chatplatform.load.Relabel'
    args = [(project.findProperty('relabel.dir') ?: '../docs/benchmarks').toString()]
}
