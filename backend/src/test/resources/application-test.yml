spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    # Flyway's PostgreSQL-specific SQL won't run on H2.
    # Unit tests that only need the context to load disable Flyway here.
    # Integration tests (Testcontainers) use the PostgreSQL container directly
    # and re-enable Flyway with the real driver.
    enabled: false

jwt:
  secret: "this-is-a-test-secret-key-that-is-at-least-40-bytes-long"

ws:
  allowed-origins: http://localhost:3000,http://localhost:5173

# Not production (ADR-0011): anyone may register; limits high enough for local use and test suites.
registration:
  mode: open
ratelimit:
  register-per-ip-per-hour: 100000
  login-per-ip-per-minute: 100000
  login-per-ip-and-user-per-minute: 100000
  ticket-per-user-per-minute: 100000
  failed-handshakes-per-ip-per-minute: 100000
  search-per-user-per-minute: 100000
  guest-per-ip-per-hour: 100000
  signup-global-per-hour: 100000

# The H2 database here has no schema: don't seed the welcome bot at startup (ADR-0012).
guest:
  seed-bot: false
