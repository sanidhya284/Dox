spring:
  application:
    name: chatplatform-backend

  datasource:
    # ── Connection coordinates ─────────────────────────────────────────────
    # All values come from environment variables so that the same image runs
    # in local Docker, CI, and (eventually) production without code changes.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatplatform}
    username: ${DB_USER:chatplatform}
    password: ${DB_PASSWORD:chatplatform}
    driver-class-name: org.postgresql.Driver

    # ── HikariCP connection pool ───────────────────────────────────────────
    # APPLICATION THREADS ≠ DB CONNECTIONS — this is a critical distinction.
    #
    # Your web server (Tomcat) creates one thread per request (default 200).
    # If every thread tried to hold a DB connection simultaneously you would
    # exhaust the DB's max_connections instantly.
    #
    # HikariCP maintains a *bounded* pool of long-lived connections that
    # threads borrow and return.  Threads that arrive when the pool is full
    # wait up to connection-timeout ms before failing.
    #
    # Rule of thumb for a single-node backend with PostgreSQL:
    #   pool_size = (core_count × 2) + effective_spindle_count
    # We start conservatively at 10 — tune in production after profiling.
    hikari:
      pool-name: chatplatform-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000     # ms — how long a thread waits for a connection
      idle-timeout: 600000          # ms — how long an idle connection survives
      max-lifetime: 1800000         # ms — hard cap on connection age (prevents stale sockets)
      connection-test-query: SELECT 1

  # ── Flyway ──────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Rollback safety (ADR-0011 Decision 10): an OLDER release must still start against a database that a newer
    # release already migrated. Flyway then sees applied migrations it doesn't know ("future") and must not
    # refuse to start. This is Flyway's default; set explicitly so it's never changed by accident
    # (FutureMigrationToleranceTest).
    ignore-migration-patterns: "*:future"

# ── Actuator ──────────────────────────────────────────────────────────────
# Expose health endpoint only.  We will expose more endpoints selectively
# in later milestones (metrics, info) once we have something worth reporting.
management:
  endpoints:
    web:
      exposure:
        # prometheus/metrics need the metrics user (HTTP Basic, METRICS_PASSWORD); health stays public. ADR-0009.
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.chatplatform: DEBUG
    org.flywaydb: INFO

# ── WebSocket ─────────────────────────────────────────────────────────────
# Every socket is closed (code 4001) this long after its handshake; the client
# reconnects with a fresh ticket. Env override: WS_SESSION_MAX_LIFETIME (ISO-8601,
# e.g. PT15M). Startup refuses zero or negative values. See ADR-0005.
ws:
  # Open sockets per user; the next one is closed with 4007 (ADR-0006). Env: WS_MAX_SOCKETS_PER_USER.
  max-sockets-per-user: ${WS_MAX_SOCKETS_PER_USER:10}
  session:
    max-lifetime: PT15M
  # Heartbeats (ADR-0007): ping every interval; close (4006) after timeout with no pong or frame.
  # Env overrides: WS_HEARTBEAT_INTERVAL, WS_HEARTBEAT_TIMEOUT. Startup requires timeout >= 2 x interval.
  heartbeat:
    interval: PT25S
    timeout: PT60S


# ── Phase 6 hardening (ADR-0011) ──────────────────────────────────────────
# Behind Caddy: Tomcat's RemoteIpValve takes the client IP from X-Forwarded-For, but only when the
# request comes from a trusted proxy (private or loopback address). The app has no public port.
server:
  forward-headers-strategy: native

# Who may register (ADR-0011, amended by ADR-0012). 'open' (default since Phase 6b): anyone, behind the per-IP
# and global sign-up limits. 'invite': the request needs REGISTRATION_INVITE_CODE; with no code, closed (403).
registration:
  mode: ${REGISTRATION_MODE:open}
  invite-code: ${REGISTRATION_INVITE_CODE:}

# In-memory, per instance (Phase 4 moves them to Redis). Heuristics; NAT users share the per-IP limits.
ratelimit:
  register-per-ip-per-hour: 5
  login-per-ip-per-minute: 20
  login-per-ip-and-user-per-minute: 5
  ticket-per-user-per-minute: 30
  failed-handshakes-per-ip-per-minute: 20
  search-per-user-per-minute: 30
  guest-per-ip-per-hour: 3
  signup-global-per-hour: 200
  max-keys: 100000

# "Try the demo" guests (ADR-0012): at most max-live at once (DEMO_BUSY beyond); removed after ttl by a job
# that runs every cleanup-interval.
guest:
  max-live: 1000
  ttl: PT24H
  cleanup-interval: PT15M

# Demo accounts demo1..demo3 + "Demo room", seeded at startup when DEMO_PASSWORD is set. Public data only.
demo:
  password: ${DEMO_PASSWORD:}

# Refresh-token cookie (ADR-0010). Secure (HTTPS only) everywhere except the dev profile.
auth:
  refresh-cookie:
    secure: true

# The commit the image was built from, for GET /api/version (ADR-0011). Set by the image (GIT_SHA build arg).
app:
  git-sha: ${APP_GIT_SHA:unknown}
