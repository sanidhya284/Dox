spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatplatform
    username: chatplatform
    password: chatplatform

logging:
  level:
    com.chatplatform: DEBUG
    org.springframework.jdbc: DEBUG

jwt:
  # LOCAL DEVELOPMENT ONLY. Never use in production.
  secret: "local-dev-secret-key-that-is-at-least-40-bytes-long-12345"

ws:
  # LOCAL DEVELOPMENT ONLY. Exact origins of the local frontend dev servers.
  allowed-origins: http://localhost:3000,http://localhost:5173

metrics:
  # LOCAL DEVELOPMENT ONLY. Password of the 'metrics' user for /actuator/prometheus (HTTP Basic).
  password: dev-only-metrics-password-123

# Not production (ADR-0011): anyone may register; limits high enough for local use and test suites.
registration:
  mode: open
ratelimit:
  register-per-ip-per-hour: 100000
  login-per-ip-per-minute: 100000
  login-per-ip-and-user-per-minute: 100000
  ticket-per-user-per-minute: 100000
  failed-handshakes-per-ip-per-minute: 100000
  search-per-user-per-minute: 100000
  guest-per-ip-per-hour: 100000
  signup-global-per-hour: 100000
  send-per-user-per-minute: 100000
  send-per-guest-per-minute: 100000
  dm-per-user-per-hour: 100000
  dm-per-guest-per-hour: 100000

# Local http://localhost only: allow the refresh cookie without HTTPS (ADR-0010).
auth:
  refresh-cookie:
    secure: false
